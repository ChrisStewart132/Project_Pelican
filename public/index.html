<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelican - AI Prompt Compiler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #11111b;
            --surface: rgba(30, 30, 46, 0.7);
            --surface-hover: rgba(49, 50, 68, 0.8);
            --text: #cdd6f4;
            --text-muted: #a6adc8;
            --primary: #89b4fa;
            --primary-hover: #b4befe;
            --border: rgba(69, 71, 90, 0.4);
            --accent-gradient: linear-gradient(135deg, #89b4fa 0%, #cba6f7 100%);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(137, 180, 250, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(203, 166, 247, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .glass-panel {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            margin-bottom: 30px;
            border-bottom: none;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .container {
            display: flex;
            gap: 30px;
            flex: 1;
            min-height: 0;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .sidebar {
            width: 380px;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 0;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
            letter-spacing: 0.3px;
        }

        .main-content label {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--primary);
        }

        select,
        textarea {
            width: 100%;
            background: rgba(17, 17, 27, 0.6);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(137, 180, 250, 0.2);
            background: rgba(17, 17, 27, 0.8);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23cdd6f4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(17, 17, 27, 0.4);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .checkbox-item:hover {
            border-color: var(--primary-hover);
            background: rgba(17, 17, 27, 0.7);
            transform: translateY(-1px);
        }

        .checkbox-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 6px;
            margin: 0;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all 0.2s ease;
            background: rgba(17, 17, 27, 0.6);
            flex-shrink: 0;
        }

        .checkbox-item input[type="checkbox"]::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--bg);
            background-color: var(--bg);
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .checkbox-item input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-item input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        .checkbox-item span {
            cursor: pointer;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            user-select: none;
        }

        .dep-badge {
            font-size: 0.7rem;
            background: rgba(137, 180, 250, 0.15);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(137, 180, 250, 0.3);
            letter-spacing: 0.5px;
        }

        textarea {
            flex: 1;
            resize: none;
            font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        button {
            background: var(--accent-gradient);
            color: var(--bg);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(137, 180, 250, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(137, 180, 250, 0.4);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(137, 180, 250, 0.3);
        }
    </style>
</head>

<body>

    <header class="glass-panel">
        <h1>Pelican Architect Compiler</h1>
        <button onclick="compilePrompt()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            Compile Prompt
        </button>
    </header>

    <div class="container">
        <!-- Configuration Sidebar -->
        <div class="sidebar glass-panel">
            <div class="form-group">
                <label for="system-select">System Prompt</label>
                <select id="system-select">
                    <option value="">Loading...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="architect-select">Architect Prompt</label>
                <select id="architect-select">
                    <option value="">Loading...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="project-select">Project Prompt</label>
                <select id="project-select">
                    <option value="">Loading...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Code Interfaces</label>
                <div class="checkbox-group" id="interfaces-list">
                    <!-- Checkboxes populated via JS -->
                </div>
            </div>
        </div>

        <!-- Output Area -->
        <div class="main-content glass-panel">
            <label for="output-prompt">Compiled AI Transcript Prompt</label>
            <textarea id="output-prompt"
                placeholder="Your compiled prompt will appear here... Feel free to edit before copying."></textarea>
            <div style="display: flex; justify-content: flex-end;">
                <button onclick="copyToClipboard()" style="width: 220px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    Copy to Clipboard
                </button>
            </div>
        </div>
    </div>

    <script>
        // Store raw data globally for fast compilation
        const dataStore = {
            system: [], architect: [], project: [], interfaces: []
        };

        async function fetchData(type) {
            try {
                const response = await fetch(`api.php?type=${type}`);
                return await response.json();
            } catch (err) {
                console.error("Failed to fetch data:", err);
                return [];
            }
        }

        function populateSelect(selectId, data) {
            const select = document.getElementById(selectId);
            select.innerHTML = '';
            if (!data || data.error) return;

            data.forEach(item => {
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = item.title;
                select.appendChild(option);
            });
        }

        function populateInterfaces(data) {
            const container = document.getElementById('interfaces-list');
            container.innerHTML = '';
            if (!data || data.error) return;

            data.forEach(item => {
                const label = document.createElement('label');
                label.className = 'checkbox-item';

                // Show a clean, small dependency badge if dependencies exist
                const deps = item.dependencies ? `<span class="dep-badge">Requires ID: ${item.dependencies}</span>` : '';

                // Compact layout: Just the checkbox, title, and dependency badge
                label.innerHTML = `
                    <input type="checkbox" class="interface-cb" value="${item.id}" data-deps="${item.dependencies}">
                    <span>
                        <strong>${item.title}</strong> ${deps}
                    </span>
                `;
                container.appendChild(label);
            });

            // Add event listeners for dependency auto-checking
            document.querySelectorAll('.interface-cb').forEach(cb => {
                cb.addEventListener('change', handleDependencyCheck);
            });
        }

        // Recursively auto-enable required Code Interfaces
        function handleDependencyCheck(e) {
            if (!e.target.checked) return; // Only trigger logic when checking a box

            const depsStr = e.target.getAttribute('data-deps');
            if (!depsStr) return;

            const deps = depsStr.split(',').map(id => id.trim());
            deps.forEach(depId => {
                if (!depId) return; // Safety check for trailing commas

                const depCheckbox = document.querySelector(`.interface-cb[value="${depId}"]`);
                if (depCheckbox && !depCheckbox.checked) {
                    depCheckbox.checked = true;

                    // Flash effect to show the human architect it was auto-selected
                    depCheckbox.parentElement.style.backgroundColor = 'rgba(137, 180, 250, 0.4)';
                    setTimeout(() => depCheckbox.parentElement.style.backgroundColor = '', 600);

                    // Recursively check deeper dependencies
                    depCheckbox.dispatchEvent(new Event('change'));
                }
            });
        }

        async function initApp() {
            // Fetch all data
            dataStore.system = await fetchData('system');
            dataStore.architect = await fetchData('architect');
            dataStore.project = await fetchData('project');
            dataStore.interfaces = await fetchData('interfaces');

            // Populate UI
            populateSelect('system-select', dataStore.system);
            populateSelect('architect-select', dataStore.architect);
            populateSelect('project-select', dataStore.project);
            populateInterfaces(dataStore.interfaces);
        }

        function compilePrompt() {
            const sysId = document.getElementById('system-select').value;
            const archId = document.getElementById('architect-select').value;
            const projId = document.getElementById('project-select').value;

            const sysContent = dataStore.system.find(i => i.id == sysId)?.content || '';
            const archContent = dataStore.architect.find(i => i.id == archId)?.content || '';
            const projContent = dataStore.project.find(i => i.id == projId)?.content || '';

            // Get selected interfaces
            const selectedCbs = document.querySelectorAll('.interface-cb:checked');
            let interfacesText = '';

            selectedCbs.forEach(cb => {
                const iface = dataStore.interfaces.find(i => i.id == cb.value);
                if (iface) {
                    interfacesText += `--- [INTERFACE: ${iface.title}] ---\n${iface.content}\n\n`;
                }
            });

            // Construct Final Prompt Template
            const finalPrompt = `[SYSTEM INSTRUCTIONS]
${sysContent}

[ARCHITECT ROLE]
${archContent}

[PROJECT SPECIFICATION]
${projContent}

[REQUIRED CODE INTERFACES]
The following abstract interfaces MUST be implemented and adhered to strictly to ensure modularity.

${interfacesText ? interfacesText : "No specific code interfaces provided for this module."}

[EXECUTION INSTRUCTIONS]
Please generate the code required to fulfill the PROJECT SPECIFICATION utilizing the REQUIRED CODE INTERFACES above. Provide complete files without truncation.`;

            document.getElementById('output-prompt').value = finalPrompt;
        }

        function copyToClipboard() {
            const textarea = document.getElementById('output-prompt');

            // Modern clipboard API is more reliable for edited textareas
            if (navigator.clipboard) {
                navigator.clipboard.writeText(textarea.value).then(() => {
                    alert('Prompt copied to clipboard!');
                }).catch(err => {
                    console.error('Failed to copy text: ', err);
                });
            } else {
                // Fallback for older browsers
                textarea.select();
                document.execCommand('copy');
                alert('Prompt copied to clipboard!');
            }
        }

        // Boot
        initApp();
    </script>
</body>

</html>
