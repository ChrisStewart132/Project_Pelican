<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelican - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #11111b;
            --surface: rgba(30, 30, 46, 0.7);
            --surface-hover: rgba(49, 50, 68, 0.8);
            --text: #cdd6f4;
            --text-muted: #a6adc8;
            --primary: #a6e3a1;
            --primary-hover: #94e2d5;
            --edit: #f9e2af;
            --error: #f38ba8;
            --border: rgba(69, 71, 90, 0.4);
            --accent-gradient: linear-gradient(135deg, #a6e3a1 0%, #94e2d5 100%);
            --edit-gradient: linear-gradient(135deg, #f9e2af 0%, #fab387 100%);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(166, 227, 161, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(249, 226, 175, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .admin-container {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 650px;
            box-shadow: var(--shadow);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            padding-bottom: 20px;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            border-bottom: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            background: rgba(17, 17, 27, 0.6);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(166, 227, 161, 0.2);
            background: rgba(17, 17, 27, 0.8);
        }

        textarea {
            resize: vertical;
            min-height: 180px;
            font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23cdd6f4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .help-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        button {
            background: var(--accent-gradient);
            color: var(--bg);
            border: none;
            padding: 16px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(166, 227, 161, 0.2);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(166, 227, 161, 0.3);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(166, 227, 161, 0.2);
        }

        /* Segmented Control for Radio Buttons */
        .mode-toggle {
            display: flex;
            background: rgba(17, 17, 27, 0.6);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .mode-toggle label {
            flex: 1;
            text-align: center;
            padding: 12px;
            margin-bottom: 0;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.3s ease;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .mode-toggle input[type="radio"] {
            display: none;
        }

        .mode-toggle label:has(input[value="create"]:checked) {
            background: var(--accent-gradient);
            color: var(--bg);
            box-shadow: 0 4px 12px rgba(166, 227, 161, 0.2);
        }

        .mode-toggle label:has(input[value="edit"]:checked) {
            background: var(--edit-gradient);
            color: var(--bg);
            box-shadow: 0 4px 12px rgba(249, 226, 175, 0.2);
        }

        /* Smooth Messages */
        .message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: none;
            text-align: center;
            font-weight: 600;
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-success {
            background: rgba(166, 227, 161, 0.15);
            color: var(--primary);
            border: 1px solid rgba(166, 227, 161, 0.3);
        }

        .msg-error {
            background: rgba(243, 139, 168, 0.15);
            color: var(--error);
            border: 1px solid rgba(243, 139, 168, 0.3);
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            width: 100%;
        }

        .nav-link:hover {
            color: var(--primary);
            transform: translateX(-5px);
        }
    </style>
</head>

<body>

    <div class="admin-container">
        <h1>Pelican Data Management</h1>

        <div id="status-msg" class="message"></div>

        <div class="mode-toggle">
            <label><input type="radio" name="mode" value="create" checked onchange="handleModeChange()"> Create
                New</label>
            <label><input type="radio" name="mode" value="edit" onchange="handleModeChange()"> Edit Existing</label>
        </div>

        <form id="adminForm" onsubmit="submitData(event)">

            <div class="form-group">
                <label for="secret">Admin Password</label>
                <input type="password" id="secret" required placeholder="Enter the password from api.php">
            </div>

            <div class="form-group">
                <label for="type">Category</label>
                <select id="type" required onchange="handleTypeChange()">
                    <option value="system">System Prompt</option>
                    <option value="architect">Architect Prompt</option>
                    <option value="project">Project Prompt</option>
                    <option value="interfaces">Code Interface</option>
                </select>
            </div>

            <!-- This dropdown only appears in Edit Mode -->
            <div class="form-group" id="edit-selection-group" style="display: none;">
                <label for="item-select">Select Item to Edit</label>
                <select id="item-select" onchange="loadSelectedData()">
                    <option value="">-- Select an item --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="title">Title / Name</label>
                <input type="text" id="title" required placeholder="e.g., Grid Based World">
            </div>

            <div class="form-group">
                <label for="content">Content Specifications</label>
                <textarea id="content" required
                    placeholder="Enter the prompt or abstract interface specification here..."></textarea>
            </div>

            <div class="form-group" id="dep-group" style="display: none;">
                <label for="dependencies">Dependencies (Optional)</label>
                <input type="text" id="dependencies" placeholder="e.g., 1, 4">
                <div class="help-text">Comma-separated list of Interface IDs this relies on. Look at your main app UI to
                    find the IDs.</div>
            </div>

            <button type="submit" id="submit-btn">Save to Database</button>
        </form>

        <a href="index.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Pelican Compiler
        </a>
    </div>

    <script>
        let currentFetchedItems = [];

        function getMode() {
            return document.querySelector('input[name="mode"]:checked').value;
        }

        function handleModeChange() {
            const mode = getMode();
            const editGroup = document.getElementById('edit-selection-group');
            const btn = document.getElementById('submit-btn');

            document.getElementById('status-msg').style.display = 'none';

            if (mode === 'edit') {
                editGroup.style.display = 'block';
                btn.style.background = 'var(--edit-gradient)';
                btn.style.color = '#111';
                btn.style.boxShadow = '0 4px 15px rgba(249, 226, 175, 0.3)';
                btn.innerText = 'Update Database';
                fetchItemsForEdit();
            } else {
                editGroup.style.display = 'none';
                btn.style.background = 'var(--accent-gradient)';
                btn.style.color = 'var(--bg)';
                btn.style.boxShadow = '0 4px 15px rgba(166, 227, 161, 0.2)';
                btn.innerText = 'Save to Database';
                clearForm();
            }
        }

        function handleTypeChange() {
            const type = document.getElementById('type').value;
            const depGroup = document.getElementById('dep-group');

            if (type === 'interfaces') {
                depGroup.style.display = 'block';
            } else {
                depGroup.style.display = 'none';
                document.getElementById('dependencies').value = '';
            }

            if (getMode() === 'edit') {
                fetchItemsForEdit();
            }
        }

        async function fetchItemsForEdit() {
            const type = document.getElementById('type').value;
            const select = document.getElementById('item-select');

            select.innerHTML = '<option value="">Loading...</option>';

            try {
                const response = await fetch(`api.php?type=${type}`);
                currentFetchedItems = await response.json();

                select.innerHTML = '<option value="">-- Select an item --</option>';
                currentFetchedItems.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    opt.textContent = `[ID: ${item.id}] ${item.title}`;
                    select.appendChild(opt);
                });
            } catch (error) {
                select.innerHTML = '<option value="">Error loading items</option>';
            }

            clearForm();
        }

        function loadSelectedData() {
            const selectedId = document.getElementById('item-select').value;
            const item = currentFetchedItems.find(i => i.id == selectedId);

            if (item) {
                document.getElementById('title').value = item.title;
                document.getElementById('content').value = item.content;
                if (document.getElementById('type').value === 'interfaces') {
                    document.getElementById('dependencies').value = item.dependencies || '';
                }
            } else {
                clearForm();
            }
        }

        function clearForm() {
            document.getElementById('title').value = '';
            document.getElementById('content').value = '';
            document.getElementById('dependencies').value = '';
        }

        // --- NEW: Safe Base64 Encoder to bypass Hostinger Firewall ---
        function encodeForTransit(str) {
            const bytes = new TextEncoder().encode(str);
            const binString = Array.from(bytes, (byte) => String.fromCodePoint(byte)).join("");
            return btoa(binString);
        }

        async function submitData(e) {
            e.preventDefault();

            const mode = getMode();
            const btn = document.getElementById('submit-btn');
            const msgBox = document.getElementById('status-msg');

            let editId = null;
            if (mode === 'edit') {
                editId = document.getElementById('item-select').value;
                if (!editId) {
                    alert('Please select an item to edit.');
                    return;
                }
            }

            btn.disabled = true;
            btn.innerText = 'Processing...';
            msgBox.style.display = 'none';

            // Scramble the content before sending it over the network
            const rawContent = document.getElementById('content').value;
            const scrambledContent = encodeForTransit(rawContent);

            const payload = {
                secret: document.getElementById('secret').value,
                type: document.getElementById('type').value,
                title: document.getElementById('title').value,
                content: scrambledContent,
                dependencies: document.getElementById('dependencies').value,
                is_base64: true // Flag to tell api.php to decode it
            };

            if (editId) {
                payload.id = editId;
            }

            try {
                const response = await fetch('api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    msgBox.className = 'message msg-success';
                    msgBox.innerText = result.message;
                    msgBox.style.display = 'block';

                    if (mode === 'create') {
                        clearForm();
                    } else {
                        fetchItemsForEdit();
                    }
                } else {
                    msgBox.className = 'message msg-error';
                    msgBox.innerText = result.error || 'Unknown error occurred.';
                    msgBox.style.display = 'block';
                }
            } catch (error) {
                msgBox.className = 'message msg-error';
                msgBox.innerText = 'Network error: Could not reach api.php';
                msgBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = mode === 'edit' ? 'Update Database' : 'Save to Database';
            }
        }
    </script>
</body>

</html>
